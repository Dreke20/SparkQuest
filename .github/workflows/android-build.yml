name: Build Android APK & Production AAB Bundle

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Make Gradle Executable
        run: |
          chmod +x android/gradlew
          sed -i 's/\r$//' android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Release Keystore (If Secret Exists)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          echo "KEYSTORE_PATH=release-keystore.jks" >> $GITHUB_ENV

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Build Android Production Release Bundle (.aab)
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparkquest-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Production Release AAB Bundle (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: sparkquest-android-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab

  build-flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ./sparkquest_flutter
        run: flutter pub get

      - name: Run Flutter Static Analysis
        working-directory: ./sparkquest_flutter
        run: flutter analyze

      - name: Run Automated Widget & Service Tests
        working-directory: ./sparkquest_flutter
        run: flutter test

      - name: Build Native Flutter Release APK
        working-directory: ./sparkquest_flutter
        run: flutter build apk --release

      - name: Build Native Flutter Play Store AAB
        working-directory: ./sparkquest_flutter
        run: flutter build appbundle --release

      - name: Upload Native Flutter Release APK
        uses: actions/upload-artifact@v4
        with:
          name: sparkquest-flutter-release-apk
          path: sparkquest_flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Native Flutter Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sparkquest-flutter-release-aab
          path: sparkquest_flutter/build/app/outputs/bundle/release/app-release.aab
